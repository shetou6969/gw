name: Publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          bash -n install.sh bootstrap.sh
          python3 -m compileall -q gw.py setup.py gwlib
          python3 -m unittest discover -s tests -v
      - name: Build release assets
        run: python3 tools/make_release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="v$(cat VERSION)"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG 已存在；保持已发布资产不变。"
            exit 0
          fi
          gh release create "$VERSION_TAG" "dist/$VERSION_TAG/gw-panel.tar.gz" "dist/$VERSION_TAG/SHA256SUMS" --title "GW Panel $VERSION_TAG" --generate-notes --target "$GITHUB_SHA"
